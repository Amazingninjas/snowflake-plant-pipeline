[project]
name = "plantgen"
version = "0.1.0"
description = "Synthetic data for a coating & slitting plant, feeding a Snowflake medallion pipeline"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
plantgen = "plantgen.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    { include-group = "emulator" },
]
# Local Snowflake emulator for testing the SQL (plantgen emulate). fakesnow 0.12 needs a
# connector older than 5.0, which dropped a module it imports.
emulator = [
    "fakesnow>=0.12",
    "snowflake-connector-python>=3.12,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plantgen"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["plantgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
